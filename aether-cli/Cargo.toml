[package]
name = "aether-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.53", features = ["derive"]}
reqwest = { version = "0.12", features = ["json"]}
dirs = "6.0.0"
ratatui = { version = "0.30.0", features = ["all-widgets"] }
crossterm = { version = "0.29.0", features = ["event-stream", "osc52"] }
futures = "0.3.31"
aether-core = { path = "../aether-core"}
aether-worker = { path = "../aether-worker"}
aether-broker = { path = "../aether-broker"}

anyhow.workspace = true
thiserror.workspace = true
base64.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
bcrypt.workspace = true


[dev-dependencies]
tempfile = { version = "3.24" }

[[bin]]
name = "aether"
path = "src/main.rs"
